; ============================================================
; ESP32-S3 CSI Node — MIDDLE (COM7)
;
; Flash with:
;   python run_s3.py
; Or manually:
;   pio run --target upload
;
; If upload hangs at "Connecting...":
;   Hold the BOOT button while dots appear, then release.
;
; Board note:
;   Default board is esp32-s3-devkitc-1 (Espressif official).
;   If your S3 board is different, change the board line.
;   Common alternatives: esp32s3box, um_feathers3, adafruit_feather_esp32s3
; ============================================================

[env:MIDDLE]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed      = 115200
upload_port        = COM7
monitor_port       = COM7
upload_resetmethod = nodemcu

build_flags =
    -DNODE_ID=\"MIDDLE\"
    -DWIFI_SSID=\"Oneplus8\"
    -DWIFI_PASS=\"aightt14\"
    -DPROBE_INTERVAL_MS=100
    -DCORE_DEBUG_LEVEL=0
