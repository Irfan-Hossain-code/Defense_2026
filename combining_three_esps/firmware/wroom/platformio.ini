; ============================================================
; WROOM CSI Node — LEFT (COM9), RIGHT (COM8), MIDDLE (Mac)
; One source file, three build environments.
;
; Windows — flash LEFT:   python run_wroom.py left
; Windows — flash RIGHT:  python run_wroom.py right
;
; Mac — flash MIDDLE (run these in combining_three_esps/firmware/wroom/):
;   pip3 install platformio
;   pio run -e MIDDLE --target upload
; ============================================================

[common]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed   = 115200
upload_resetmethod = nodemcu
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DWIFI_SSID=\"Oneplus8\"
    -DWIFI_PASS=\"aightt14\"
    -DPROBE_INTERVAL_MS=100

[env:LEFT]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed      = ${common.monitor_speed}
upload_resetmethod = ${common.upload_resetmethod}
build_flags = ${common.build_flags} -DNODE_ID=\"LEFT\"
upload_port  = COM9
monitor_port = COM9

[env:RIGHT]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed      = ${common.monitor_speed}
upload_resetmethod = ${common.upload_resetmethod}
build_flags = ${common.build_flags} -DNODE_ID=\"RIGHT\"
upload_port  = COM8
monitor_port = COM8

; ── MIDDLE — flashed from friend's Mac ───────────────────────────────────────
; After flashing, run bridge_middle.py on the Mac to stream data to Windows.
[env:MIDDLE]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed      = ${common.monitor_speed}
upload_resetmethod = nodemcu
build_flags = ${common.build_flags} -DNODE_ID=\"MIDDLE\"
upload_port  = /dev/cu.usbserial-1130
monitor_port = /dev/cu.usbserial-1130
