; ============================================================
; ESP32 CSI Test Firmware — PlatformIO configuration
; Board: ESP32-WROOM-32 (any generic ESP32 dev board)
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor baud rate — must match Serial.begin() in main.cpp
monitor_speed = 115200

; ---- Set these to your board's COM port ----
; Run: python port_test.py  (from the project root)
; Example Windows: COM3, COM4, COM5
upload_port  = COM7
monitor_port = COM7

; nodemcu reset method: uses DTR+RTS signals on the CP210x chip to automatically
; pull EN and BOOT pins, putting the ESP32 into download mode without pressing buttons.
; Works on boards that have the capacitor reset circuit (most ESP32-WROOM dev boards).
; If it still fails, hold the BOOT button when you see "Connecting......" in the output.
upload_resetmethod = nodemcu

; Log level: 1=Error, 2=Warn, 3=Info, 4=Debug, 5=Verbose
; Keep at 1 for clean CSI output; raise to 3 if something fails
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Uncomment to use a specific platform version (more stable, less bleeding-edge)
; platform = espressif32@6.4.0
